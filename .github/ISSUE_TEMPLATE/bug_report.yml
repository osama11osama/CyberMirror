name: Bug report
description: Report a reproducible CyberMirror bug
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not** paste real personal identifiers, API keys, scan databases, or private reports.
        Use placeholders (e.g. `user@example.com`) in reproduction steps.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps using fictional identifiers only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CyberMirror / OS / Python / Node versions
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Strip tokens, paths under your home directory, and personal data.
    validations:
      required: false
