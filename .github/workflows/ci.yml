name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          files = [
              name
              for name in subprocess.check_output(
                  ["git", "ls-files", "-z"]
              ).decode().split("\0")
              if name
          ]

          forbidden_exact = {
              "data/wmn-data.json",
              "data/runtime_settings.json",
              "data/secrets.json",
              "data/.api_token",
              "data/.encryption_key",
              "data/.setup_complete",
          }

          def is_forbidden_tracked_path(name: str) -> bool:
              basename = pathlib.PurePosixPath(name).name

              if name in forbidden_exact:
                  return True

              if basename == ".env":
                  return True
              if basename.startswith(".env.") and basename != ".env.example":
                  return True

              if name.endswith(".sqlite3"):
                  return True

              if name.startswith(("data/cache/", "data/logs/")):
                  return True

              if name.startswith("exports/") and name != "exports/.gitkeep":
                  return True

              return False

          path_cases = {
              ".env": True,
              ".env.local": True,
              "config/.env.production": True,
              ".env.example": False,
              "config/.env.example": False,
              "data/cache/search-result.json": True,
              "data/logs/app.log": True,
              "exports/report.json": True,
              "exports/.gitkeep": False,
              "data/example.json": False,
          }
          for sample, expected in path_cases.items():
              actual = is_forbidden_tracked_path(sample)
              if actual != expected:
                  raise AssertionError(
                      f"Repository-hygiene path check regression for {sample!r}: "
                      f"expected {expected}, got {actual}"
                  )

          forbidden_paths = [name for name in files if is_forbidden_tracked_path(name)]
          if forbidden_paths:
              print("Runtime/private files must not be tracked:")
              print("\n".join(forbidden_paths))
              sys.exit(1)

          # Reject common machine-specific absolute paths in tracked UTF-8 text,
          # but do not mistake normal HTTP(S) URL path segments for local paths.
          machine_path_patterns = [
              re.compile(r"(?<![A-Za-z0-9])[A-Za-z]:\\"),
              # Windows drive paths written with forward slashes.
              re.compile(r"(?<![A-Za-z0-9])[A-Za-z]:/(?:Users|home)/[^/\s]+/"),
              re.compile(r"(?<![A-Za-z0-9:/])/(?:Users|home)/[^/\s]+/"),
          ]
          web_url_pattern = re.compile(r"https?://[^\s<>()\[\]{}\"']+")

          def contains_machine_path(line: str) -> bool:
              without_web_urls = web_url_pattern.sub("", line)
              return any(
                  pattern.search(without_web_urls)
                  for pattern in machine_path_patterns
              )

          windows_path = (
              "C:" + chr(92) + "Users" + chr(92) + "alice"
              + chr(92) + "file.txt"
          )
          windows_forward_slash_path = "C:" + "/" + "Users/alice/file.txt"
          posix_home_path = "/" + "home/alice/file.txt"
          content_cases = {
              windows_path: True,
              "prefix " + windows_path: True,
              windows_forward_slash_path: True,
              "path=" + windows_forward_slash_path: True,
              posix_home_path: True,
              "path=" + posix_home_path: True,
              "https://example.com/home/alice/profile": False,
              "See https://example.com/Users/alice/profile": False,
              "https://cdn.example.com/" + windows_forward_slash_path: False,
          }
          for sample, expected in content_cases.items():
              actual = contains_machine_path(sample)
              if actual != expected:
                  raise AssertionError(
                      f"Repository-hygiene content check regression for {sample!r}: "
                      f"expected {expected}, got {actual}"
                  )

          findings = []
          for name in files:
              path = pathlib.Path(name)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for line_no, line in enumerate(text.splitlines(), 1):
                  if contains_machine_path(line):
                      findings.append(f"{name}:{line_no}: {line.strip()}")

          if findings:
              print("Machine-specific absolute path(s) found in tracked text:")
              print("\n".join(findings))
              sys.exit(1)
          PY

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Pytest
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cybermirror:ci .
      - name: Run container and hit health
        run: |
          set -euo pipefail
          docker run -d --name cm-ci -p 8787:8787 -e HOST=0.0.0.0 cybermirror:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health | grep -q '"status"'; then
              echo "health ok"
              docker stop cm-ci
              exit 0
            fi
            sleep 2
          done
          docker logs cm-ci || true
          docker stop cm-ci || true
          exit 1
