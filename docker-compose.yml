services:
  cybermirror:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - cm-data:/app/data
      - cm-exports:/app/exports
    environment:
      # Container must listen on all interfaces so published ports work.
      - HOST=0.0.0.0
      - PORT=8787
      - ENCRYPTION_ENABLED=true
      # Optional: pin a stable token (bundled UI loads it via /cybermirror-runtime.js).
      # - API_TOKEN=change-me
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  cm-data:
  cm-exports:
